<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="atwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="atwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="atwCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="atwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Background -->
  <polygon points="32,3 58,18 58,46 32,61 6,46 6,18" fill="url(#atwBg)" stroke="url(#atwGold)" stroke-width="2.5" />
  
  <!-- Subtle Inner Border -->
  <polygon points="32,7 54,20 54,44 32,57 10,44 10,20" fill="none" stroke="url(#atwCyan)" stroke-width="1" opacity="0.6" />

  <!-- Star Accent at Top -->
  <polygon points="32,10 33.5,14 37.5,14.5 34.5,17 35.5,21 32,19 28.5,21 29.5,17 26.5,14.5 30.5,14" fill="#fbbf24" />

  <!-- Monogram ATW -->
  <text x="32" y="42" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="url(#atwGold)" text-anchor="middle" letter-spacing="1" filter="url(#atwGlow)">ATW</text>
  
  <!-- Subtitle Line -->
  <rect x="22" y="47" width="20" height="2" rx="1" fill="url(#atwCyan)" opacity="0.9" />
</svg>